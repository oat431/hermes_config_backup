# Streaming-ready nginx location block (SSE / MCP / event streams)
# Copy into an existing server {} and change `upstream` + the path prefix.

location /stream-or-sse-path/ {
    proxy_pass http://upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    proxy_buffering off;          # critical: flush SSE events immediately
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 1d;        # keep long-lived streams alive
    proxy_send_timeout 1d;
    proxy_connect_timeout 10s;
    gzip off;                     # never compress an event stream
}

