# Official searxng compose template (from searxng/searxng container/ folder),
# adapted for Windows: the `:Z` SELinux mount flag is removed (breaks Docker Desktop),
# default port set to 7004 to match the homelab convention.
name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-7004}:${SEARXNG_PORT:-7004}
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
